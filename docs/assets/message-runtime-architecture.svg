<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pallas-Bot 统一消息入口</title>
  <desc id="desc">OneBot 消息经过统一消息入口后分流到 direct 与 matcher，两条路径最终汇入出站与任务设施。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Droid Sans Fallback', 'WenQuanYi Zen Hei', 'Noto Sans CJK SC', sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 21px; font-weight: 400; fill: #64748b; }
      .node-title { font-size: 25px; font-weight: 700; fill: #172033; }
      .node-copy { font-size: 18px; font-weight: 400; fill: #526071; }
      .callout { font-size: 17px; font-weight: 600; fill: #334155; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>
  <text class="title" x="80" y="82">Pallas-Bot 统一消息入口</text>
  <text class="subtitle" x="80" y="120">精确命令走短路径，复杂生态保持兼容</text>

  <path class="line" d="M330 430H430"/>
  <path class="line" d="M740 390C800 390 800 275 865 275"/>
  <path class="line" d="M740 470C800 470 800 610 865 610"/>
  <path class="line" d="M1115 275H1185"/>
  <path class="line" d="M1115 610H1185"/>
  <path class="line" d="M1415 275C1490 275 1490 410 1435 430"/>
  <path class="line" d="M1415 610C1490 610 1490 485 1435 465"/>
  <path class="dash" d="M585 525V720H785"/>

  <g>
    <rect x="80" y="350" width="250" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="node-title" x="205" y="420" text-anchor="middle">OneBot 消息</text>
    <text class="node-copy" x="205" y="458" text-anchor="middle">协议端入站事件</text>
  </g>

  <g>
    <rect x="430" y="330" width="310" height="200" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <text class="node-title" x="585" y="410" text-anchor="middle">统一消息入口</text>
    <text class="node-copy" x="585" y="450" text-anchor="middle">轻量分类与命令规划</text>
    <text class="node-copy" x="585" y="482" text-anchor="middle">统一运行时</text>
  </g>

  <g>
    <rect x="865" y="195" width="250" height="160" rx="8" fill="#ecfdf5" stroke="#16836a" stroke-width="3"/>
    <text class="node-title" x="990" y="260" text-anchor="middle" fill="#126b58">direct 路径</text>
    <text class="node-copy" x="990" y="300" text-anchor="middle">已接入的精确命令</text>
    <text class="callout" x="990" y="335" text-anchor="middle">减少无关 matcher 扇出</text>
  </g>

  <g>
    <rect x="1185" y="195" width="230" height="160" rx="8" fill="#f0fdfa" stroke="#16836a" stroke-width="2"/>
    <text class="node-title" x="1300" y="255" text-anchor="middle">统一副作用提交</text>
    <text class="node-copy" x="1300" y="296" text-anchor="middle">回复 · 持久任务</text>
    <text class="node-copy" x="1300" y="326" text-anchor="middle">完成效果</text>
  </g>

  <g>
    <rect x="865" y="530" width="250" height="160" rx="8" fill="#eff6ff" stroke="#376ca8" stroke-width="3"/>
    <text class="node-title" x="990" y="595" text-anchor="middle" fill="#285d98">matcher 路径</text>
    <text class="node-copy" x="990" y="635" text-anchor="middle">复杂交互与兼容插件</text>
    <text class="callout" x="990" y="670" text-anchor="middle">长期兼容，无需全部迁移</text>
  </g>

  <g>
    <rect x="1185" y="530" width="230" height="160" rx="8" fill="#f8fafc" stroke="#376ca8" stroke-width="2"/>
    <text class="node-title" x="1300" y="590" text-anchor="middle">NoneBot 执行</text>
    <text class="node-copy" x="1300" y="630" text-anchor="middle">状态 · 前缀 · @ 语义</text>
    <text class="node-copy" x="1300" y="660" text-anchor="middle">多步会话</text>
  </g>

  <g>
    <rect x="1260" y="385" width="260" height="130" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <text class="node-title" x="1390" y="440" text-anchor="middle">出站与任务设施</text>
    <text class="node-copy" x="1390" y="478" text-anchor="middle">发送队列 · Work Jobs</text>
  </g>

  <g>
    <rect x="785" y="710" width="250" height="110" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="node-title" x="910" y="758" text-anchor="middle">Telemetry</text>
    <text class="node-copy" x="910" y="792" text-anchor="middle">路径 · 完成结果 · 错误</text>
  </g>

  <g>
    <rect x="1110" y="750" width="410" height="70" rx="8" fill="#fff7ed" stroke="#c97828" stroke-width="2"/>
    <text class="callout" x="1315" y="792" text-anchor="middle">提交开始后不回落重试，避免重复执行</text>
  </g>
</svg>
