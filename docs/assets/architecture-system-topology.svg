<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
  <title id="title">Pallas-Bot 系统拓扑</title>
  <desc id="desc">协议端接入 Pallas-Bot Core。WebUI 通过 Core 提供的 API 管理运行时；Core 连接 LLM Provider、官方扩展、社区扩展，媒体和遗留 RWKV 请求 Pallas-Bot-AI。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
    </marker>
    <style>
      .node { fill: #fff; stroke: #c4b5fd; stroke-width: 2.5; }
      .core { fill: #f1edff; stroke: #7c3aed; stroke-width: 3; }
      .edge { stroke: #8b5cf6; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .optional { stroke: #8b5cf6; stroke-width: 3; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
      .label { fill: #1f1738; font: 600 23px sans-serif; text-anchor: middle; }
      .sub { fill: #665a82; font: 16px sans-serif; text-anchor: middle; }
      .kicker { fill: #7c3aed; font: 600 15px sans-serif; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1440" height="500" fill="#fbfaff" />
  <path class="edge" d="M 260 250 H 430" />
  <path class="edge" d="M 900 130 H 710 V 190" />
  <path class="edge" d="M 710 250 H 880" />
  <path class="edge" d="M 640 310 V 390 H 890" />
  <path class="edge" d="M 640 310 V 390 H 1190" />
  <path class="optional" d="M 710 290 H 1190" />

  <g>
    <rect class="node" x="60" y="185" width="200" height="130" rx="18" />
    <text class="kicker" x="160" y="225">INGRESS</text>
    <text class="label" x="160" y="260">协议端 / QQ</text>
    <text class="sub" x="160" y="290">OneBot WebSocket</text>
  </g>
  <g>
    <rect class="core" x="430" y="160" width="280" height="180" rx="22" />
    <text class="kicker" x="570" y="205">CORE</text>
    <text class="label" x="570" y="245">Pallas-Bot</text>
    <text class="sub" x="570" y="278">运行时、产品语义、Agent</text>
    <text class="sub" x="570" y="303">配置、插件与分片</text>
  </g>
  <g>
    <rect class="node" x="900" y="65" width="260" height="130" rx="18" />
    <text class="kicker" x="1030" y="105">CONTROL</text>
    <text class="label" x="1030" y="140">Pallas-Bot-WebUI</text>
    <text class="sub" x="1030" y="170">前端与运行管理</text>
  </g>
  <g>
    <rect class="node" x="880" y="205" width="260" height="130" rx="18" />
    <text class="kicker" x="1010" y="245">MODEL</text>
    <text class="label" x="1010" y="280">LLM Provider</text>
    <text class="sub" x="1010" y="310">普通聊天与工具调用</text>
  </g>
  <g>
    <rect class="node" x="890" y="365" width="220" height="100" rx="18" />
    <text class="kicker" x="1000" y="400">EXTENSION</text>
    <text class="label" x="1000" y="435">官方扩展</text>
  </g>
  <g>
    <rect class="node" x="1170" y="365" width="220" height="100" rx="18" />
    <text class="kicker" x="1280" y="400">EXTENSION</text>
    <text class="label" x="1280" y="435">社区扩展</text>
  </g>
  <g>
    <rect class="node" x="1170" y="205" width="220" height="130" rx="18" />
    <text class="kicker" x="1280" y="245">OPTIONAL</text>
    <text class="label" x="1280" y="280">Pallas-Bot-AI</text>
    <text class="sub" x="1280" y="310">媒体与遗留 RWKV</text>
  </g>
</svg>
