[project]
name = "pallas-bot"
version = "4.4.5"
description = "《明日方舟》帕拉斯 Bot"
authors = [{ name = "MistEO" }]
maintainers = [
    { name = "mxcoras", email = "mxcoras@outlook.com" },
    { name = "TogetsuDo", email = "togetsudo@outlook.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.0.0",
    "beanie>=2.0.0",
    "httpx[socks]>=0.28.1",
    "mcp>=2.3,<3",
    "jieba>=0.42.1",
    "nb-cli>=1.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-alconna>=0.60.3",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot2[fastapi]>=2.4.4",
    "nvidia-ml-py>=13.595.45",
    "pillow==13.0.0",
    "pillowmd>=0.7.3",
    "pypinyin>=0.55.0",
    "python-multipart>=0.0.20",
    "python-ulid>=3.1.0",
    "psutil>=6.1.0",
    "tenacity>=9.1.2",
    "curl-cffi>=0.9.0",
    "aiohttp>=3.14.4",
    "nonebot-plugin-localstore>=0.7",
    "nonebot-plugin-htmlrender>=0.7,<0.8",
    "githubkit>=0.13,<0.14",
    "mdit-py-emoji>=0.1",
    "packaging>=24.0",
    # 4.0 默认 PostgreSQL；Mongo 站点仍可用 beanie，多装这两项无害
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # 多机协同 coord / 分片 claim；新装默认需要，勿再藏进 optional
    "redis>=5.2,<6",
    # 安全下限：传递依赖无法在 dependencies 里自然表达，按已修复版本直接钉下限，
    # 使 wheel 元数据（PyPI / pip 安装路径）同样受保护，而非仅 [tool.uv] 约束。
    "multidict>=6.9.1",
    "pymongo>=4.18.2",
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
    "virtualenv>=21.14.7",
]

[project.optional-dependencies]
perf = [
    "jieba-next>=1.0.0a5"
]
# 兼容旧文档/脚本的 `uv sync --extra pg`；驱动已在主依赖
pg = []
# 兼容旧文档/脚本；redis 已在主依赖
coord-redis = []
shard = []
deploy-shard = []
# 兼容旧构建参数；PG / Redis 均已在主依赖
deploy-shard-pg = []
# 可选本机 Embedding（fastembed）。有 editable 插件时请用
# `uv sync --inexact --extra embedding-local`（--inexact 保留额外依赖与 editable 插件）。
# fastembed 0.8.0 官方声明 Pillow <13；项目固定 Pillow 13 并在 [tool.uv] 临时覆盖该上限，
# 待上游放宽后复验并撤除。
embedding-local = [
    "fastembed==0.8.0",
]

[project.scripts]
pallas = "pallas.console.cli.main:main"

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "ruff>=0.11.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mongomock-motor>=0.0.30",
]

[tool.uv]
# 临时越过 fastembed 0.8.0 声明的 Pillow <13 上限。仅项目工具配置，不写入 wheel；
# 裸 pip / uv pip 安装 embedding extra 仍会因官方元数据冲突解析失败。上游兼容后复验撤除。
override-dependencies = ["pillow==13.0.0"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.nonebot]
plugin_dirs = ["packages"]
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []
nonebot-plugin-apscheduler = ["nonebot_plugin_apscheduler"]

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pallas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 目录树无 __init__.py，同名测试文件（test_direct/test_service/test_runtime 等）在 prepend 模式下
# 模块名冲突导致全量收集报 import file mismatch；importlib 模式按文件路径唯一导入。
addopts = ["--import-mode=importlib"]
