name: CI

on:
  push:
    branches: [ main, master, dev, dev-v2 ]
  pull_request:
    branches: [ main, master, dev, dev-v2 ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # core plugin matrix 测试会加载 kernel/LLM 与分片 coord（需 sqlalchemy、redis；二者已在主依赖）
          uv sync --dev

      - name: Run Ruff linting
        run: |
          uv run ruff check --output-format=github pallas/ packages/

      - name: Run Ruff formatting check
        run: |
          uv run ruff format --check pallas/ packages/

      - name: Check plugin imports (packages)
        run: |
          uv run python tools/check_plugin_imports.py --scope packages

      - name: Build pallas-core wheel
        run: |
          ./scripts/build_core.sh
          test -f build/pallas-core/dist/pallas_core-*.whl

      - name: Run core plugin matrix tests
        run: |
          # registry / coord 与 loader 分进程：loader 会 nonebot.load_plugin，
          # 同进程内再 import packages.* 或二次 load 易触发插件槽冲突
          uv run pytest \
            tests/common/test_plugin_matrix.py \
            tests/common/test_plugin_registry.py \
            tests/common/test_plugin_coord.py \
            tests/common/test_shard_coord_duel_group.py \
            tests/common/test_shard_coord_spy_group.py \
            -q
          uv run pytest tests/common/test_plugin_loader_unified.py -q

      - name: Run runtime reliability regression tests
        run: |
          env -u PG_TEST_DSN uv run pytest \
            tests/common/test_media_cache_async.py \
            tests/platform/work_jobs/test_entrypoint.py \
            tests/platform/work_jobs/test_service.py \
            tests/platform/work_jobs/test_pg_store.py \
            tests/platform/message_runtime/test_committer.py \
            tests/platform/ingress/test_send_queue.py \
            tests/platform/ingress/test_send_queue_retry.py \
            tests/plugins/pb_webui/test_console_read_cache_snapshot.py \
            tests/plugins/repeater/test_work_enqueue.py \
            tests/plugins/repeater/test_payload_replay.py \
            tests/plugins/repeater/test_fanout_reply.py \
            tests/plugins/repeater/test_message_runtime_handler.py \
            tests/plugins/repeater/test_responder.py \
            tests/plugins/repeater/test_speaker.py \
            tests/plugins/repeater/test_work_payload.py \
            tests/product/llm/test_group_insight_processor.py \
            tests/product/llm/test_repeater_semantic_style.py \
            tests/product/llm/test_offline_quality_eval.py \
            -q

      - name: Run Redis ingress, federate roster and ban snapshot regressions
        run: |
          env -u PG_TEST_DSN uv run pytest \
            tests/platform/ingress/test_ingress_redis_nonblocking.py \
            tests/common/federate/test_peer_bots.py \
            tests/common/federate/test_peer_bots_sync.py \
            tests/platform/test_connected_roster.py \
            tests/plugins/blacklist/test_ban_gate_snapshot_sync.py \
            -p no:nonebug -p no:cacheprovider -q

      - name: Run LLM chat chain regression tests
        run: |
          env -u PG_TEST_DSN uv run pytest \
            tests/product/llm/test_context_assembler.py \
            tests/product/llm/test_kernel_llm.py \
            tests/product/llm/test_llm_chain_regression.py \
            tests/product/llm/test_query_progress.py \
            tests/product/llm/test_tool_discovery_loop.py \
            tests/product/llm/test_tool_loop_budget.py \
            tests/product/llm/test_persona_output_firewall.py \
            tests/product/llm/test_reply_delivery_segments.py \
            tests/product/llm/test_emotion_followup.py \
            tests/product/llm/test_sticker_vision.py \
            tests/product/llm/test_turn_telemetry.py \
            tests/product/llm/test_provider_telemetry.py \
            tests/product/llm/test_provider_empty_output_attribution.py \
            tests/product/llm/test_provider_api_key_failover.py \
            tests/product/llm/test_telemetry_task_metadata.py \
            tests/platform/test_ai_callback_delivery.py \
            tests/platform/test_ai_callback_telemetry.py \
            tests/platform/test_llm_emotion_followup_delivery.py \
            tests/platform/test_ai_callback_runner.py \
            -p no:nonebug -p no:cacheprovider -q

      - name: Check console OpenAPI spec drift
        run: |
          uv run python tools/check_console_openapi_drift.py

      - name: Type check with mypy
        run: |
          # uv run mypy src/

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Check dependency vulnerabilities
        run: |
          uv sync --dev
          env -u PG_TEST_DSN uv run pytest tests/common/test_dependency_audit.py \
            -p no:nonebug -p no:cacheprovider -q
          uv run python tools/audit_dependencies.py

  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test Docker build
        run: |
          LABEL="$(git describe --tags --always --dirty 2>/dev/null || true)"
          if [ -z "${LABEL}" ]; then LABEL="sha-${GITHUB_SHA:0:7}"; fi
          docker build --build-arg "PALLAS_BOT_VERSION=${LABEL}" --build-arg "PALLAS_BOT_COMMIT=${GITHUB_SHA}" -t test-build .
