name: Health Check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要检查的 Docker 镜像版本（例如 v2.0.0）'
        required: true
        type: string

jobs:
  docker-health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull and test Docker image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/pallas-bot:${{ steps.get_version.outputs.version }}"
          docker pull "${IMAGE}"

          # 运行容器进行健康检查
          docker run --name test-container -d "${IMAGE}"

          # 等待容器启动
          sleep 10

          # 检查容器状态
          if docker ps | grep -q test-container; then
            echo "✅ Container started successfully"
          else
            echo "❌ Container failed to start"
            docker logs test-container
            exit 1
          fi

          # 清理
          docker stop test-container
          docker rm test-container

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  performance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Check import performance
        run: |
          uv run python -c "
          import time
          start = time.time()

          # 测试核心模块导入时间（内核 pallas）
          import pallas
          print(f'✅ pallas core import time: {time.time() - start:.2f}s')

          try:
              from packages import pb_core
              print(f'✅ built-in plugin import time: {time.time() - start:.2f}s')
          except Exception as e:
              print(f'⚠️  Built-in plugin import skipped in headless check: {type(e).__name__}')
          "

      - name: Memory usage check
        run: |
          uv run python -c "
          import os
          import psutil
          process = psutil.Process(os.getpid())
          memory_mb = process.memory_info().rss / 1024 / 1024
          print(f'📊 Base memory usage: {memory_mb:.1f} MB')

          if memory_mb > 100:
              print('⚠️  High memory usage detected')
          else:
              print('✅ Memory usage is acceptable')
          " || echo "psutil not available, skipping memory check"
